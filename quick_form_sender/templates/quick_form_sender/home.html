{% extends 'quick_form_sender/_base.html' %}
{% block title %}Envío rápido{% endblock %}
{% block content %}
<section class="card">
  <h1>Envío rápido de formularios</h1>
  <p>Elige qué tipo de cliente vas a enviar.</p>
  <div class="stack" style="margin-top:22px">
    <a class="button large" href="{{ url_for('quick_form_sender.existing', slug=slug) }}">Cliente existente<small>Buscar un cliente y generar su formulario.</small></a>
    <form id="newClientForm" method="post" action="{{ url_for('quick_form_sender.new_generate', slug=slug) }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <button class="large secondary" type="submit" id="newClientGenerateButton">Cliente nuevo<small>Generar y copiar mensaje</small></button>
    </form>
  </div>
  <div id="newClientFeedback" class="toast" role="status" aria-live="polite" hidden></div>
  <form method="post" action="{{ url_for('quick_form_sender.logout', slug=slug) }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <button class="logout" type="submit">Cerrar sesión</button>
  </form>
</section>
{% endblock %}
{% block scripts %}
<script>
(function () {
  var form = document.getElementById('newClientForm');
  var generateButton = document.getElementById('newClientGenerateButton');
  var feedback = document.getElementById('newClientFeedback');
  var csrfToken = form.querySelector('input[name="csrf_token"]').value;
  var feedbackTimer;

  function showFeedback(message) {
    window.clearTimeout(feedbackTimer);
    feedback.hidden = false;
    feedback.textContent = message;
    feedbackTimer = window.setTimeout(function () {
      feedback.hidden = true;
      feedback.textContent = '';
    }, 3000);
  }

  function buildMessage(link) {
    return window.buildClientPublicFormMessageNuevo(link);
  }

  function fallbackCopy(message) {
    var area = document.createElement('textarea');
    area.value = message;
    area.setAttribute('readonly', '');
    area.style.position = 'fixed';
    area.style.opacity = '0';
    document.body.appendChild(area);
    area.select();
    try {
      document.execCommand('copy');
      area.remove();
      return Promise.resolve(true);
    } catch (_) {
      area.remove();
      return Promise.resolve(false);
    }
  }

  function copyMessage(message) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(message).then(function () { return true; }).catch(function () {
        return fallbackCopy(message);
      });
    }
    return fallbackCopy(message);
  }

  function generateAndCopy(event) {
    event.preventDefault();
    generateButton.disabled = true;
    showFeedback('Generando...');
    fetch(form.action, {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'X-Requested-With': 'XMLHttpRequest', 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' },
      body: new URLSearchParams({ csrf_token: csrfToken }).toString()
    }).then(function (response) {
      return response.json().then(function (data) {
        if (!response.ok || !data.ok || !data.link) {
          throw new Error(data.error || 'No pudimos generar el formulario.');
        }
        return data;
      });
    }).then(function (data) {
      return copyMessage(buildMessage(data.link));
    }).then(function (copied) {
      showFeedback(copied ? 'Mensaje copiado' : 'No pudimos copiar el mensaje.');
    }).catch(function (error) {
      showFeedback(error.message || 'No pudimos generar el formulario.');
    }).finally(function () {
      generateButton.disabled = false;
    });
  }

  form.addEventListener('submit', generateAndCopy);
})();
</script>
{% endblock %}
