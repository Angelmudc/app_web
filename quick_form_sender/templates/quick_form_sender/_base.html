<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}Acceso rápido{% endblock %} · Doméstica del Cibao</title>
  <style>
    :root { color-scheme: light; --ink:#16384f; --muted:#5c7180; --accent:#0f6a7f; --soft:#edf6fa; --border:#d7e5ef; }
    * { box-sizing: border-box; }
    body { margin:0; min-width:320px; background:#f5f9fb; color:var(--ink); font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    main { width:min(100% - 28px, 500px); margin:0 auto; padding:28px 0 max(28px, env(safe-area-inset-bottom)); }
    .brand { margin:10px 0 28px; font-size:1.05rem; font-weight:800; letter-spacing:.01em; }
    .card { background:#fff; border:1px solid var(--border); border-radius:20px; box-shadow:0 10px 30px rgba(30,58,90,.08); padding:22px; }
    h1 { margin:0 0 8px; font-size:1.55rem; line-height:1.15; }
    h2 { margin:0 0 14px; font-size:1.1rem; }
    p { color:var(--muted); line-height:1.45; }
    label { display:block; margin:16px 0 6px; font-weight:700; }
    input[type=text], input[type=password], input[type=search] { width:100%; min-height:50px; border:1px solid #b9ccd8; border-radius:12px; padding:12px 14px; font:inherit; }
    button, .button { display:flex; width:100%; min-height:52px; align-items:center; justify-content:center; border:0; border-radius:13px; background:var(--accent); color:#fff; cursor:pointer; font:inherit; font-weight:800; text-decoration:none; padding:12px 16px; }
    button.secondary, .button.secondary { background:var(--soft); color:var(--accent); border:1px solid var(--border); }
    button.large, .button.large { min-height:82px; flex-direction:column; gap:4px; font-size:1.05rem; }
    button.large small, .button.large small { color:inherit; font-size:.78rem; font-weight:500; opacity:.86; }
    form { margin:0; }
    .stack { display:grid; gap:12px; }
    .error { margin:14px 0 0; padding:11px 12px; border-radius:10px; background:#fff1f1; color:#8f2f2f; }
    .success { margin:14px 0; padding:12px; border-radius:10px; background:#edf9f2; color:#17633d; overflow-wrap:anywhere; }
    .client-row { display:grid; gap:8px; padding:14px 0; border-bottom:1px solid #e6eef2; }
    .client-row:last-child { border-bottom:0; }
    .client-name { font-weight:800; }
    .client-meta { color:var(--muted); font-size:.9rem; }
    .link-box { margin:18px 0; padding:12px; background:#f5f9fb; border:1px solid var(--border); border-radius:12px; overflow-wrap:anywhere; font-size:.88rem; }
    .actions { display:grid; gap:10px; }
    .logout { margin-top:22px; background:transparent; color:var(--muted); min-height:40px; }
    .back { display:inline-block; margin-bottom:18px; color:var(--accent); font-weight:700; text-decoration:none; }
  </style>
</head>
<body>
  <main>
    <div class="brand">Doméstica del Cibao</div>
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
