<div class="modal fade"
     id="gestionarPlanModal"
     tabindex="-1"

     aria-hidden="true"
     data-admin-body-modal="true"
     data-admin-modal-z="2000"
     data-admin-reset-on-close="true">
  <div class="modal-dialog modal-dialog-centered modal-xl modal-dialog-scrollable">
    <div class="modal-content border-0 shadow">
      <div class="modal-header">
        <h2 class="modal-title h5 visually-hidden" id="gestionarPlanModalLabel">Gestionar plan</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body p-0">
        <div id="gestionarPlanAsyncScope" data-admin-async-scope>
          <div id="gestionarPlanAsyncRegion" data-async-preserve-scroll="true">
            <div class="p-4">
              <div class="d-flex align-items-center gap-2 text-muted">
                <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
                <span>Selecciona una solicitud para cargar el plan.</span>

            </div>
          </div>
        </div>
      </div>
    </div>
